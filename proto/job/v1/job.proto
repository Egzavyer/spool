syntax = "proto3";
package job.v1;

import "google/protobuf/timestamp.proto";

message CreateJobTypeRequest {
    string name = 1; // name of the new job type
}

message JobType {
    int32 id = 1;
    string name = 2;
}

message CreateJobRequest {
    int32 job_type_id = 1; // id of the type of the job requested to be run
}

enum JobStatus {
    JOB_STATUS_UNSPECIFIED = 0;
    JOB_STATUS_PENDING = 1;
    JOB_STATUS_COMPLETED = 2;
    JOB_STATUS_FAILED = 3;
    JOB_STATUS_RUNNING = 4;
}

message Job {
    string id = 1;
    google.protobuf.Timestamp requested_at = 2;
    google.protobuf.Timestamp updated_at = 3;
    JobStatus status = 4;
    JobType job_type = 5;
}

message GetJobTypeRequest {
    int32 id = 1;
}

message GetJobTypesResponse {
    repeated JobType job_types = 1;
}

message GetJobRequest {
    string id = 1;
}

message GetJobsResponse {
    repeated Job jobs = 1;
}